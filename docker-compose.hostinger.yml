services:
  web:
    build:
      context: .
    image: fixgo:latest
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
      - path: .env.mongodb.production
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - default
      - hotfix24-data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - path: .env.production
        required: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  hotfix24-data:
    external: true
