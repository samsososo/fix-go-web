services:
  web:
    build:
      context: .
    image: fixgo-dev:latest
    restart: unless-stopped
    env_file:
      - path: .env.dev
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - path: .env.dev
        required: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config

volumes:
  caddy_dev_data:
  caddy_dev_config:
